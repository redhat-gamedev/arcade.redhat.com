# Intentionally empty.
#
# This file OVERWRITES the base image's /etc/httpd/conf.d/ssl.conf,
# which listens on 8443 and references TLS certificate files that do
# not ship in the image — httpd would fail to start. In-pod TLS is not
# needed: the OpenShift route terminates TLS.
#
# (The base image has no shell, so files cannot be deleted with RUN —
# they are neutralized by overwriting them instead.)
