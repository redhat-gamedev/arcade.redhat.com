# arcade.redhat.com — httpd site configuration (installed as a conf.d drop-in)
#
# The base image (registry.access.redhat.com/hi/httpd) sets
# AllowOverride None, so the repo's .htaccess file is ignored. This
# drop-in applies the same rule at server level, keeping parity with
# the old S2I deployment.

# Block access to git repository content.
# (Was .htaccess: RedirectMatch 403 /\.git )
RedirectMatch 403 /\.git

# The httpd-cnf/ build inputs are copied into the docroot by
# "COPY ." (the base image has no shell, so they cannot be deleted at
# build time) — keep them off the web.
RedirectMatch 403 ^/httpd-cnf(/|$)
